version: 1
bindings:
  - bindingId: sap.mm.inventory.md04-stock-req-list
    type: JCO_RFC
    rfcName: BAPI_MATERIAL_STOCK_REQ_LIST
    allowedImports:
      - MATERIAL_LONG
      - MATERIAL
      - PLANT
      - MRP_AREA
      - UNIT
    allowedOutputs:
      - MRP_IND_LINES
      - RETURN
    constraints:
      sideEffect: none
      timeoutMs: 30000
  - bindingId: sap.mm.purchaseorder.list-odata
    type: ODATA
    serviceRef: API_PURCHASEORDER_PROCESS_SRV
    entitySet: A_PurchaseOrder
    method: GET
    filterMapping:
      poNumber: PurchaseOrder
      vendor: Supplier
      plant: Plant
      material: Material
      createdSince: CreationDate
    topLimit: 50
    selectFields:
      - PurchaseOrder
      - Supplier
      - Plant
      - Material
      - OrderQuantity
      - PurchaseOrderQuantityUnit
    constraints:
      sideEffect: none
      timeoutMs: 30000
  - bindingId: sap.mm.material.get-detail
    type: JCO_RFC
    rfcName: BAPI_MATERIAL_GET_DETAIL
    # Transcribed from a live SAP repository read on 2026-08-25 (plan task 5.1),
    # not from remembered BAPI shape. PLANT is opt=true at the SAP level but the
    # registry declares the input required: without it MATERIALPLANTDATA comes
    # back uninitialized and PUR_GROUP does not exist.
    allowedImports:
      - MATERIAL
      - MATERIAL_LONG
      - PLANT
    allowedOutputs:
      - MATERIAL_GENERAL_DATA
      - MATERIALPLANTDATA
      - RETURN
    constraints:
      sideEffect: none
      timeoutMs: 30000
  - bindingId: sap.mm.pr.create-draft
    type: JCO_RFC
    rfcName: BAPI_PR_CREATE
    allowedImports:
      - PRITEM
      - PRITEMEXP
      - PRHEADER
      - PRHEADEREXP
      - RETURN
    allowedOutputs:
      - NUMBER
      - PRITEMEXP
      - PRHEADEREXP
      - RETURN
    constraints:
      sideEffect: sap_write
      timeoutMs: 30000
  - bindingId: sap.sd.salesorder.getlist
    type: JCO_RFC
    rfcName: BAPI_SALESORDER_GETLIST
    # Field-level signature confirmed 2026-08-30 via public SAP object catalogs
    # (sapdatasheet.org mirror of the SE37 signature): FM BAPI_SALESORDER_GETLIST,
    # row structure BAPIORDERS for the SALES_ORDERS table.
    allowedImports:
      - CUSTOMER_NUMBER
      - SALES_ORGANIZATION
      - MATERIAL
      - DOCUMENT_DATE
    allowedOutputs:
      - SALES_ORDERS
      - RETURN
    constraints:
      sideEffect: none
      timeoutMs: 30000
  - bindingId: sap.fi.ar.get-open-items
    type: JCO_RFC
    rfcName: BAPI_AR_ACC_GETOPENITEMS
    # Field-level signature confirmed 2026-08-30 via public SAP object catalogs
    # (sapdatasheet.org mirror of the SE37 signature): FM BAPI_AR_ACC_GETOPENITEMS,
    # row structure BAPI3007_2. The returned table is LINEITEMS, not OPENITEMS.
    allowedImports:
      - CUSTOMER
      - COMPANYCODE
      - KEYDATE
    allowedOutputs:
      - LINEITEMS
      - RETURN
    constraints:
      sideEffect: none
      timeoutMs: 30000
  - bindingId: sap.fi.ap.get-open-items
    type: JCO_RFC
    rfcName: BAPI_AP_ACC_GETOPENITEMS
    # Field-level signature confirmed 2026-08-30 via public SAP object catalogs
    # (sapdatasheet.org mirror of the SE37 signature): FM BAPI_AP_ACC_GETOPENITEMS,
    # row structure BAPI3008_2. The returned table is LINEITEMS, not OPENITEMS.
    allowedImports:
      - VENDOR
      - COMPANYCODE
      - KEYDATE
    allowedOutputs:
      - LINEITEMS
      - RETURN
    constraints:
      sideEffect: none
      timeoutMs: 30000
