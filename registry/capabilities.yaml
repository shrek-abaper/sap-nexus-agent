version: 2
capabilities:
  - capabilityId: MM.Inventory.GetAvailability
    name: Inventory Availability
    description: Read the SAP MD04 stock/requirements list for a material and plant, returning MRP element lines and the running available quantity.
    status: active
    kind: Function
    domain: MM
    businessObject: InventoryStock
    ontologyIri: sapnexus:MM_Inventory_GetAvailability
    semanticType: sapnexus:InventoryAvailabilityReadFunction
    aliases:
      - 库存需求清单查询
      - 物料可用量
      - MD04查询
      - 库存
    examples:
      - 查物料 DEMOA2 在 1000 工厂的库存/需求清单（可用量）
      - 1000 工厂 DEMOA2 的 MD04 可用量
    intent:
      intentName: inventory_availability
      primaryKeywords:
        - '库存'
        - '可用量'
        - '可用库存'
        - '还有多少'
      weakKeywords:
        - '有没有'
      triggerKeywords:
        - '库存'
        - '可用量'
        - '可用库存'
        - '还有多少'
        - '有没有'
      fieldNames:
        zh-CN:
          material: 物料编号
          plant: 工厂
          unit: 单位
      clarifyPrompt:
        zh-CN:
          cases:
            - missing:
                - material
              text: '请提供要查询的物料编号。'
            - missing:
                - plant
              text: '请提供要查询的工厂。'
          fallback:
            template: '请提供要查询的物料编号和工厂。'
    inputs:
      - name: material
        semanticName: materialNumber
        semanticType: sapnexus:MaterialNumber
        bindingKind: identifier
        required: true
        type: string
        minLength: 1
        maxLength: 40
        sapParameter: MATERIAL
        extraction:
          matchers:
            - kind: semanticType
              ref: MaterialNumber
          priority: 10
          excludes:
            - plant
            - unit
          resolver: text
          reaskSuspect: true
      - name: plant
        semanticName: plant
        semanticType: sapnexus:Plant
        bindingKind: identifier
        required: true
        type: string
        minLength: 1
        maxLength: 4
        pattern: ^[A-Z0-9]{4}$
        sapParameter: PLANT
        extraction:
          matchers:
            - kind: semanticType
              ref: Plant
          priority: 20
          resolver: text
      - name: unit
        semanticName: unitOfMeasure
        semanticType: sapnexus:UnitOfMeasure
        bindingKind: identifier
        required: false
        type: string
        minLength: 1
        maxLength: 3
        sapParameter: UNIT
        extraction:
          matchers:
            - kind: keyword
              pattern: '\bEA\b'
              value: EA
            - kind: keyword
              pattern: '\bPC\b'
              value: PC
            - kind: keyword
              pattern: '\bKG\b'
              value: KG
            - kind: keyword
              pattern: '\bG\b'
              value: G
            - kind: keyword
              pattern: '\bL\b'
              value: L
            - kind: keyword
              pattern: '\bM\b'
              value: M
          priority: 15
          resolver: text
    outputs:
      - name: availableQuantity
        semanticType: sapnexus:AvailableQuantity
        type: number
        evidenceRole: primaryFact
        factTypeRef: sapnexus:InventoryAvailabilityFact
      - name: mrpElementLines
        semanticType: sapnexus:MrpElementLine
        type: array
        evidenceRole: primaryFact
        factTypeRef: sapnexus:InventoryAvailabilityFact
      - name: returnMessages
        semanticType: sapnexus:SapReturnMessage
        type: array
        evidenceRole: executionEvidence
    executor:
      type: JCO_RFC
      rfcName: BAPI_MATERIAL_STOCK_REQ_LIST
      inputMapping:
        material: MATERIAL_LONG,MATERIAL
        plant: PLANT,MRP_AREA
        unit: UNIT
      outputMapping:
        availableQuantity: MRP_IND_LINES.WB.AVAIL_QTY1
        mrpElementLines: MRP_IND_LINES
        returnMessages: RETURN
    executorBinding:
      type: JCO_RFC
      bindingId: sap.mm.inventory.md04-stock-req-list
    evalLinkage:
      evalFile: evals/inventory_availability_cases.yaml
      caseIds:
        - happy-path
        - missing-plant
        - missing-material
        - invalid-plant
        - unknown-intent
        - gateway-sensitive-failure
        - user-rfc-name
    governance:
      sideEffect: none
      requiresApproval: false
      approvalPolicy: not_required
      dataClassification: internal
      auditRequired: true
    narrative:
      factShape: single-value
      promptTemplate: inventory-md04
      fallbackTemplate: inventory-md04
      fieldMapping:
        title: "{material} 在工厂 {plant}"
        primary: "{value} {unit}"
        detailRows: mrpElementLines
      detailFormatter: mrp-table
  - capabilityId: MM.PurchaseOrder.GetList
    name: Purchase Order List
    description: Read purchase order list through SAP OData service.
    status: active
    kind: Function
    domain: MM
    businessObject: PurchaseOrder
    ontologyIri: sapnexus:MM_PurchaseOrder_GetList
    semanticType: sapnexus:PurchaseOrderListReadFunction
    aliases:
      - 采购订单查询
      - PO查询
      - 订单
    examples:
      - 查采购订单 4500000001
      - 供应商 1000 的采购订单
    intent:
      intentName: purchase_order_list
      primaryKeywords:
        - '采购订单'
      weakKeywords:
        - '订单'
        - '(?<![A-Za-z])PO(?![A-Za-z])'
        - '采购'
      triggerKeywords:
        - '采购订单'
        - '订单'
        - '(?<![A-Za-z])PO(?![A-Za-z])'
      fieldNames:
        zh-CN:
          poNumber: 采购订单号
          vendor: 供应商
          plant: 工厂
          material: 物料
      requireAny:
        inputs:
          - poNumber
          - vendor
          - plant
          - material
        missingName: filter
      clarifyPrompt:
        zh-CN:
          cases:
            - missing:
                - filter
              text: '请至少提供一个过滤条件（采购订单号、供应商、工厂或物料）。'
    inputs:
      - name: poNumber
        semanticName: purchaseOrderNumber
        semanticType: sapnexus:PurchaseOrderNumber
        bindingKind: identifier
        required: false
        type: string
        minLength: 1
        maxLength: 40
        sapParameter: PurchaseOrder
        extraction:
          matchers:
            - kind: regex
              pattern: '(?<!\d)(\d{10})(?!\d)'
              scan: all
            - kind: regex
              pattern: '采购订单\s*([A-Z0-9]{4,10})'
          priority: 10
          excludes:
            - vendor
            - plant
          resolver: text
      - name: vendor
        semanticName: supplier
        semanticType: sapnexus:Supplier
        bindingKind: identifier
        required: false
        type: string
        minLength: 1
        maxLength: 10
        pattern: '^[A-Z0-9]{1,10}$'
        sapParameter: Supplier
        extraction:
          matchers:
            - kind: regex
              pattern: '供应商\s*([A-Z0-9]{1,10})'
          priority: 40
          resolver: text
      - name: plant
        semanticName: plant
        semanticType: sapnexus:Plant
        bindingKind: identifier
        required: false
        type: string
        minLength: 1
        maxLength: 4
        pattern: ^[A-Z0-9]{4}$
        sapParameter: Plant
        extraction:
          matchers:
            - kind: regex
              pattern: '(?:工厂\s*(\d{4}|[A-Z]\d{3}))|(?:(\d{4}|[A-Z]\d{3})\s*工厂)'
          priority: 30
          resolver: text
      - name: material
        semanticName: materialNumber
        semanticType: sapnexus:MaterialNumber
        bindingKind: identifier
        required: false
        type: string
        minLength: 1
        maxLength: 40
        sapParameter: Material
        extraction:
          matchers:
            - kind: regex
              pattern: '物料\s*([A-Za-z0-9][A-Za-z0-9\-/]+)'
          priority: 20
          resolver: text
    outputs:
      - name: purchaseOrders
        semanticType: sapnexus:PurchaseOrderItem
        type: array
        evidenceRole: primaryFact
        factTypeRef: sapnexus:PurchaseOrderSupplyFact
    executor:
      type: ODATA
    executorBinding:
      type: ODATA
      bindingId: sap.mm.purchaseorder.list-odata
    evalLinkage:
      evalFile: evals/purchase_order_cases.json
      caseIds:
        - po-by-number
        - po-by-vendor
        - po-by-material-and-plant
    governance:
      sideEffect: none
      requiresApproval: false
      approvalPolicy: not_required
      dataClassification: internal
      auditRequired: true
    narrative:
      factShape: list
      promptTemplate: purchase-order-list
      fallbackTemplate: purchase-order-list
      detailFormatter: po-list
  - capabilityId: MM.PR.CreateDraft
    name: Purchase Requisition Create Draft
    description: 创建采购申请 (PR) 草稿, 支持实物直采与间采 (成本中心)
    status: active
    kind: Action
    domain: MM
    businessObject: PurchaseRequisition
    ontologyIri: sapnexus:MM_PR_CreateDraft
    semanticType: sapnexus:PurchaseRequisitionCreateAction
    aliases:
      - 创建采购申请
      - 建PR
      - PR草稿
    examples:
      - 帮我建一个采购申请 DEMOA2 1000 100 EA
      - 创建 PR 草稿 物料 DEMOA2 工厂 1000 数量 100
    intent:
      intentName: pr_create
      primaryKeywords:
        - '采购申请'
        - '创建采购'
        - '建PR'
        - '建 PR'
        - '创建PR'
        - '创建 PR'
        - 'PR草稿'
        - 'PR 草稿'
      weakKeywords:
        - '采购'
      triggerKeywords:
        - '采购申请'
        - '建PR'
        - '建 PR'
        - '创建PR'
        - '创建 PR'
        - 'PR草稿'
        - 'PR 草稿'
      fieldNames:
        zh-CN:
          material: 物料编号
          plant: 工厂
          quantity: 数量
          unit: 单位
          delivery_date: 交货日期
          purchasing_group: 采购组
          cost_center: 成本中心(间采 PR 需提供)
      clarifyPrompt:
        zh-CN:
          strategy: groupByBindingKind
          maxRounds: 2
          fallback:
            template: '请提供: {fields}'
    inputs:
      - name: material
        semanticName: materialNumber
        semanticType: sapnexus:MaterialNumber
        bindingKind: identifier
        required: true
        type: string
        minLength: 1
        maxLength: 40
        sapParameter: PRITEM.MATERIAL
        extraction:
          matchers:
            - kind: regex
              pattern: '物料\s*([A-Za-z0-9][A-Za-z0-9\-/]+)'
          priority: 50
          resolver: text
      - name: plant
        semanticName: plant
        semanticType: sapnexus:Plant
        bindingKind: identifier
        required: true
        type: string
        minLength: 1
        maxLength: 4
        pattern: '^[A-Z0-9]{4}$'
        sapParameter: PRITEM.PLANT
        extraction:
          matchers:
            - kind: regex
              pattern: '工厂\s*(\d{4}|[A-Z]\d{3})'
          priority: 40
          resolver: text
      - name: quantity
        semanticName: quantity
        semanticType: sapnexus:Quantity
        bindingKind: identifier
        required: true
        type: number
        sapParameter: PRITEM.QUANTITY
        extraction:
          matchers:
            - kind: semanticType
              ref: Quantity
          priority: 30
          resolver: quantity
      - name: unit
        semanticName: unitOfMeasure
        semanticType: sapnexus:UnitOfMeasure
        bindingKind: identifier
        required: true
        type: string
        minLength: 1
        maxLength: 3
        sapParameter: PRITEM.UNIT
        extraction:
          matchers:
            - kind: semanticType
              ref: Unit
          priority: 25
          resolver: text
      - name: delivery_date
        semanticName: deliveryDate
        semanticType: sapnexus:DeliveryDate
        bindingKind: identifier
        required: true
        type: string
        sapParameter: PRITEM.DELIV_DATE
        extraction:
          matchers:
            - kind: semanticType
              ref: Date
          resolver: date
      - name: purchasing_group
        semanticName: purchasingGroup
        semanticType: sapnexus:PurchasingGroup
        bindingKind: identifier
        required: true
        type: string
        minLength: 1
        maxLength: 3
        sapParameter: PRITEM.PUR_GROUP
        extraction:
          matchers:
            - kind: semanticType
              ref: PurchasingGroup
          priority: 15
          resolver: text
      - name: acct_assgn_cat
        semanticName: accountAssignmentCategory
        semanticType: sapnexus:AcctAssignmentCat
        bindingKind: identifier
        required: false
        type: string
        maxLength: 1
        sapParameter: PRITEM.ACCTASSCAT
        extraction:
          matchers:
            - kind: keyword
              pattern: '(?:间采|账号分配)\s*[Kk]'
              value: K
          priority: 10
          resolver: text
      - name: cost_center
        semanticName: costCenter
        semanticType: sapnexus:CostCenter
        bindingKind: identifier
        required: false
        type: string
        maxLength: 10
        sapParameter: PRITEM.COSTCENTER
        extraction:
          matchers:
            - kind: regex
              pattern: '成本中心\s*(\d+)'
          priority: 5
          resolver: text
          when:
            field: acct_assgn_cat
            equals: K
          requiredWhen:
            field: acct_assgn_cat
            equals: K
    outputs:
      - name: prNumber
        semanticType: sapnexus:PrNumber
        type: string
        evidenceRole: primaryFact
        factTypeRef: sapnexus:PurchaseRequisitionCreatedFact
      - name: returnMessages
        semanticType: sapnexus:SapReturnMessage
        type: array
        evidenceRole: executionEvidence
    executor:
      type: JCO_RFC
      rfcName: BAPI_PR_CREATE
      inputMapping:
        material: PRITEM.MATERIAL
        plant: PRITEM.PLANT
        quantity: PRITEM.QUANTITY
        unit: PRITEM.UNIT
        delivery_date: PRITEM.DELIV_DATE
        purchasing_group: PRITEM.PUR_GROUP
        acct_assgn_cat: PRITEM.ACCTASSCAT
        cost_center: PRITEM.COSTCENTER
      outputMapping:
        prNumber: EXPORTS.NUMBER
        returnMessages: RETURN
    executorBinding:
      type: JCO_RFC
      bindingId: sap.mm.pr.create-draft
    evalLinkage:
      evalFile: evals/pr_create_cases.json
      caseIds:
        - pr-create-success-direct
        - pr-create-success-indirect
        - pr-create-missing-param
        - pr-create-indirect-missing-cost-center
        - pr-create-approval-missing
        - pr-create-approval-expired
        - pr-create-approval-version-mismatch
        - pr-create-duplicate-submit
        - pr-create-sap-business-error
    governance:
      sideEffect: sap_write
      requiresApproval: true
      approvalPolicy: human_required
      dataClassification: internal
      auditRequired: true
    narrative:
      factShape: action-receipt
      promptTemplate: pr-create-receipt
      fallbackTemplate: pr-create-receipt
      fieldMapping:
        receiptId: prNumber
      detailFormatter: none
