# Extraction MATCHER catalog — NOT the semantic-type authority.
#
# Each entry is a way of *recognising a value in user text*, keyed by a bare
# `id` that capability input matchers reference via
# {kind: semanticType, ref: <id>}. These bare ids are matcher names, not
# semantic types.
#
# The semantic-type authority is the `sapnexus:*` ontology vocabulary — the set
# declared by capability `inputs`/`outputs.semanticType`. The two vocabularies
# are joined by the ONE-WAY `extracts:` key below: every matcher declares which
# ontology type it extracts, but not every ontology type has a matcher. Types
# that are only ever derived from an upstream Fact (e.g.
# sapnexus:AvailableQuantity) correctly have no entry here.
#
# Several matchers may extract the same ontology type; a single matcher may
# never extract two.
version: 3
semanticTypes:
  - id: Plant
    extracts: sapnexus:Plant
    description: SAP plant code - 在-prefixed and 工厂-suffixed named kinds, bare 4-char code regex fallback with lookaround guards
    priority: 20
    matchers:
      - kind: prefixed
        prefix: ['在']
        valueShape: plantCode
      - kind: suffixed
        suffix: ['工厂']
        valueShape: plantCode
      - kind: regex
        pattern: '(?<!\d)([A-Z]\d{3}|\d{4})(?!\d)'
        justification: >-
          Bare 4-char code scan with digit-only lookaround guards; the
          named-kind bare scan uses alnum guards and would change behavior
          for digit-adjacent tokens.
  - id: MaterialNumber
    extracts: sapnexus:MaterialNumber
    description: Bare uppercase token scan with material guards
    priority: 10
    matchers:
      - kind: regex
        pattern: '(?<![A-Za-z0-9-])[A-Z0-9][A-Z0-9-]{1,39}(?![A-Za-z0-9-])'
        scan: all
        justification: >-
          Bare uppercase token scan with negated character-class guards; a
          named shape cannot express the negated alnum boundary.
    filters:
      minLength: 5
      notIn: ['RFCNAME']
      prefixBlacklist: ['BAPI_']
      toUpperCaseCompare: true
      toUpperCaseOutput: false
  - id: Quantity
    extracts: sapnexus:Quantity
    description: Numeric capture optionally followed by a unit token
    priority: 30
    matchers:
      - kind: regex
        pattern: '(\d+(?:\.\d+)?)\s*(?:EA|PC|KG|G|L|M)'
        ignoreCase: true
        justification: >-
          Numeric capture with an optional alternated unit token set and
          case-insensitive match; named kinds cannot express the alternation.
  - id: Unit
    extracts: sapnexus:UnitOfMeasure
    description: Unit-of-measure token, uppercased on output
    priority: 25
    matchers:
      - kind: regex
        pattern: '\b(EA|PC|KG|G|L|M)\b'
        ignoreCase: true
        justification: >-
          Unit-of-measure token set with word boundaries; named kinds cannot
          express the alternated token set.
    filters:
      toUpperCaseOutput: true
  - id: Date
    extracts: sapnexus:DeliveryDate
    description: >-
      ISO or compact (SAP DATS-style) date capture, normalized to ISO by the
      date resolver
    priority: 20
    matchers:
      - kind: regex
        pattern: '(\d{4}-\d{2}-\d{2})'
        justification: >-
          ISO date capture; a named shape matches one literal only and Date
          is its sole user, so no duplication exists to consolidate.
      - kind: regex
        pattern: '(?<!\d)(\d{8})(?!\d)'
        justification: >-
          Compact SAP DATS-style YYYYMMDD capture with digit-only lookaround
          guards so it does not carve a partial match out of a longer digit
          run (e.g. a 10-digit PO number). The date resolver reformats this
          to ISO so downstream consumers (Java Gateway LocalDate.parse, TS
          isCalendarDate) keep seeing the dashed form they require.
  - id: PurchasingGroup
    extracts: sapnexus:PurchasingGroup
    description: 采购组-prefixed code, uppercased on output
    priority: 15
    matchers:
      - kind: regex
        pattern: '采购组(?:\s|是|为|编号|号|:|：)*([A-Za-z0-9]{1,3})'
        justification: >-
          采购组-prefixed code capture; named kinds cannot express the 1-3
          character width constraint on the captured value. The connector
          alternation tolerates common natural-language phrasing between the
          keyword and the code ("采购组为601"/"采购组是601"), not just
          whitespace or direct adjacency.
    filters:
      toUpperCaseOutput: true
  - id: Vendor
    extracts: sapnexus:Supplier
    description: PO vendor number, 供应商-prefixed alphanumeric code (e.g. V72719; digit-only also accepted)
    priority: 40
    matchers:
      - kind: regex
        pattern: '供应商(?:\s|是|为|编号|号|:|：)*([A-Z0-9]{1,10})'
        justification: >-
          供应商-prefixed alphanumeric code capture; named kinds cannot
          express the 1-10 character width constraint on the captured value.
          The connector alternation tolerates common natural-language phrasing
          ("供应商为V25524"/"供应商编号是V25524"), not just whitespace.
  - id: PONumber
    extracts: sapnexus:PurchaseOrderNumber
    description: PO number - bare 10-digit form, or 采购订单-prefixed alphanumeric code for sanitized values (e.g. DEMOPO1)
    priority: 10
    matchers:
      - kind: regex
        pattern: '(?<!\d)(\d{10})(?!\d)'
        scan: all
        justification: >-
          Bare 10-digit scan with digit-only lookaround guards; alnum guards
          would change behavior for digit-adjacent tokens.
      - kind: regex
        pattern: '采购订单(?:\s|是|为|编号|号|:|：)*([A-Z0-9]{4,10})'
        justification: >-
          采购订单-prefixed alphanumeric code capture; named kinds cannot
          express the 4-10 character width constraint on the captured value.
          The connector alternation tolerates common natural-language phrasing
          ("采购订单编号是DEMOPO1"), not just whitespace.
valueShapes:
  # Deliberate loosening vs the legacy [A-Z]\d{3}|\d{4}: letter-mixed codes
  # (AB12) are now valid plant codes. All existing eval/test utterances use
  # digit codes, so matcher_cases 23/23 holds; the AB12 contract is pinned by
  # test_plant_named_kinds_extract_letter_mixed_code_ab12 (Design §3.2).
  plantCode: '^[A-Z0-9]{4}$'
