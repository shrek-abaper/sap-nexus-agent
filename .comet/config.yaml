# Configuration schema used by Comet. Do not edit this value.
schema: comet.project.v1
# Default workflow entered by /comet. Must also appear in workflows.
default_workflow: native
# Workflows enabled in this project: native, classic, or both.
workflows:
  - native
  - classic
# Enables automatic recovery through the read-only Ambient Resume probe for both Native and Classic. Set false to disable it.
# ambient_resume: true | false
ambient_resume: true
# Classic workflow settings. They do not change Native state or behavior.
classic:
  # Selects the Classic artifact layout. The default is docs; update preserves detected root-level legacy artifacts.
  # artifact_layout: legacy | docs
  artifact_layout: legacy
  # Artifact language used by Classic workflow documents.
  # language: en | zh-CN
  language: en
  # Controls beta context compression for new Classic changes.
  # context_compression: off | beta
  context_compression: off
  # Sets the default review depth for new Classic changes.
  # review_mode: off | standard | thorough
  review_mode: standard
  # Automatically enters the next Classic phase after a phase passes.
  # auto_transition: true | false
  auto_transition: true
# Native workflow settings. They do not change Classic state or behavior.
native:
  # Root directory where Native stores Comet specs, changes, and runtime data.
  artifact_root: docs
  # Artifact language used by Native workflow documents.
  # language: en | zh-CN
  language: zh-CN
  # Controls whether Native asks one clarification at a time or every currently answerable question in a round.
  # clarification_mode: sequential | batch
  clarification_mode: sequential
  # Controls the auditable project scope and bounded work used by Native content snapshots.
  snapshot:
    # Selects the project-relative paths included in Native snapshots. Patterns use / and support *, **, and ?.
    include:
      - "**/*"
    # Removes paths from the included scope. Exclusions are bound into each new change baseline.
    exclude: []
    # Bounds the number of files captured by one snapshot. Increase it for large monorepos.
    max_files: 10000
    # Bounds the total file content hashed by one snapshot. Content is streamed and does not depend on Git hashes.
    max_total_bytes: 268435456
    # Bounds snapshot capture time in milliseconds. Increase it together with the byte budget on slower or larger repositories.
    max_duration_ms: 60000
  # Controls whether Native archives automatically after a successful preview or waits for explicit user confirmation.
  # archive_confirmation: automatic | required
  archive_confirmation: automatic
  # Maximum failed Verify outcomes allowed for one confirmed contract before Native stops the completion loop.
  max_verify_failures: 5
