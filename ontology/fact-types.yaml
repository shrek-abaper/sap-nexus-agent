version: 3
# Second declaration channel for the tier-① semantic-type vocabulary, for value
# types that appear only as a field inside a Fact and that therefore no
# capability signature mentions. See schemas/fact-type-catalog.schema.json.
valueTypes:
  - id: sapnexus:PurchaseOrderItemNumber
    description: >-
      Line item number of a purchase-order item. Distinct from
      sapnexus:PurchaseOrderItem, which is the item itself (the semantic type of
      the container output `purchaseOrders`); this is that item's number. No
      capability takes or returns it as a top-level parameter, so it is declared
      here rather than in a capability signature.
factTypes:
  - factTypeId: sapnexus:InventoryAvailabilityFact
    name: Inventory Availability Fact
    description: Available inventory quantity for a material and plant.
    businessObject: InventoryStock
    predicate: sapnexus:hasInventoryAvailability
    semanticType: sapnexus:InventoryAvailability
    keyedBy:
      - sapnexus:MaterialNumber
      - sapnexus:Plant
    fields:
      - name: availableQuantity
        semanticType: sapnexus:AvailableQuantity
        cardinality: one
        optional: false
        description: Available quantity for the keyed material and plant.
      - name: mrpElementLines
        semanticType: sapnexus:MrpElementLine
        cardinality: many
        optional: true
        description: >-
          MRP element lines backing the availability figure, kept as one opaque
          list: its interior is not decomposed into fields.
  - factTypeId: sapnexus:PurchaseOrderSupplyFact
    name: Purchase Order Supply Fact
    description: Purchase-order supply items for a material and plant.
    businessObject: PurchaseOrder
    predicate: sapnexus:hasPurchaseOrderSupply
    semanticType: sapnexus:PurchaseOrderSupply
    keyedBy:
      - sapnexus:MaterialNumber
      - sapnexus:Plant
    fields:
      - name: purchaseOrder
        semanticType: sapnexus:PurchaseOrderNumber
        cardinality: many
        optional: false
        description: Purchase order number of a supply item.
      - name: purchaseOrderItem
        semanticType: sapnexus:PurchaseOrderItemNumber
        cardinality: many
        optional: false
        description: Line item number of a supply item within its purchase order.
      - name: supplier
        semanticType: sapnexus:Supplier
        cardinality: many
        optional: false
        description: Supplier of a supply item.
      - name: material
        semanticType: sapnexus:MaterialNumber
        cardinality: many
        optional: false
        description: Material of a supply item.
      - name: plant
        semanticType: sapnexus:Plant
        cardinality: many
        optional: false
        description: Receiving plant of a supply item.
      - name: orderQuantity
        semanticType: sapnexus:Quantity
        cardinality: many
        optional: false
        description: Ordered quantity of a supply item.
      - name: purchaseOrderUnit
        semanticType: sapnexus:UnitOfMeasure
        cardinality: many
        optional: false
        description: Order unit of a supply item.
  - factTypeId: sapnexus:MaterialInfoFact
    name: Material Info Fact
    description: >-
      Material master attributes needed to author a purchase requisition without
      asking the user for them. Both keys are required because the two values sit
      at different SAP levels: the base unit is client-level (MARA-MEINS, exposed
      as BAPIMATDOA-BASE_UOM) and the purchasing group is the material plant view
      (MARC-EKGRP, exposed as BAPIMATDOC-PUR_GROUP), so a material-only read
      cannot yield the purchasing group. Field names match MM.Material.GetInfo's
      output names 1:1 per corrections C2 and C5.
    businessObject: MaterialInfo
    predicate: sapnexus:hasMaterialInfo
    semanticType: sapnexus:MaterialInfo
    keyedBy:
      - sapnexus:MaterialNumber
      - sapnexus:Plant
    fields:
      - name: material
        semanticType: sapnexus:MaterialNumber
        cardinality: one
        optional: false
        description: Material the attributes belong to.
      - name: plant
        semanticType: sapnexus:Plant
        cardinality: one
        optional: false
        description: Plant whose material view the purchasing group is read from.
      - name: baseUnitOfMeasure
        semanticType: sapnexus:UnitOfMeasure
        cardinality: one
        optional: false
        description: >-
          Base unit of measure of the material. Consumed by MM.PR.CreateDraft's
          `unit` input through satisfiableByFactType.
      - name: purchasingGroup
        semanticType: sapnexus:PurchasingGroup
        cardinality: one
        optional: false
        description: >-
          Purchasing group responsible for the material at this plant. Consumed
          by MM.PR.CreateDraft's `purchasing_group` input.
  - factTypeId: sapnexus:PurchaseRequisitionCreatedFact
    name: Purchase Requisition Created Fact
    description: Identity of a purchase requisition created by an approved Action.
    businessObject: PurchaseRequisition
    predicate: sapnexus:hasCreatedPurchaseRequisition
    semanticType: sapnexus:PurchaseRequisitionCreated
    keyedBy:
      - sapnexus:PrNumber
    fields:
      - name: prNumber
        semanticType: sapnexus:PrNumber
        cardinality: one
        optional: false
        description: Number of the created purchase requisition.
