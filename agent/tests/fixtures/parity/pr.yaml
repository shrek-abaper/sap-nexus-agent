    mode: single
    utterance: 创建PR 物料 DEMOA2 工厂 1000 数量 100 EA 交货日期 2026-09-01 采购组 001
    expect:
      decision_type: SELECT
      capability_id: MM.PR.CreateDraft
      parameters:
        material: DEMOA2
        plant: '1000'
        quantity: '100'
        unit: EA
        delivery_date: '2026-09-01'
        purchasing_group: '001'
      missing: []
      clarification: null
      is_ambiguous: false
      clarification_strict: true
