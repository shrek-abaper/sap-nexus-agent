capability: MM.Inventory.GetAvailability
rows:
  - name: inv-full
    mode: single
    utterance: 查物料 DEMOA2 在 1000 工厂的可用库存
    expect:
      decision_type: SELECT
      capability_id: MM.Inventory.GetAvailability
      parameters:
        material: DEMOA2
        plant: '1000'
      missing: []
      clarification: null
      is_ambiguous: false
      clarification_strict: true
  - name: inv-missing-plant
    mode: single
    utterance: 查物料 DEMOA2 的库存
    expect:
      decision_type: CLARIFY
      capability_id: MM.Inventory.GetAvailability
      parameters:
        material: DEMOA2
      missing:
        - plant
      clarification: 请提供要查询的工厂。
      is_ambiguous: false
      clarification_strict: true
  - name: inv-missing-material
    mode: single
    utterance: 5100 工厂还有多少库存
    expect:
      decision_type: CLARIFY
      capability_id: MM.Inventory.GetAvailability
      parameters:
        plant: '5100'
      missing:
        - material
      clarification: 请提供要查询的物料编号。
      is_ambiguous: false
      clarification_strict: true
  - name: inv-missing-both
    mode: single
    utterance: 查询库存
    expect:
      decision_type: CLARIFY
      capability_id: MM.Inventory.GetAvailability
      parameters: {}
      missing:
        - material
        - plant
      clarification: 请提供要查询的物料编号和工厂。
      is_ambiguous: false
      clarification_strict: true
  - name: inv-unit-optional
    mode: single
    utterance: DEMOA2 在 5100 有多少 EA 库存
    expect:
      decision_type: SELECT
      capability_id: MM.Inventory.GetAvailability
      parameters:
        material: DEMOA2
        plant: '5100'
        unit: EA
      missing: []
      clarification: null
      is_ambiguous: false
      clarification_strict: true
  - name: inv-plant-exclusion
    mode: single
    utterance: DEMOA2 1000 的库存
    expect:
      decision_type: SELECT
      capability_id: MM.Inventory.GetAvailability
      parameters:
        material: DEMOA2
        plant: '1000'
      missing: []
      clarification: null
      is_ambiguous: false
      clarification_strict: true
  - name: inv-bapi-blacklist
    mode: single
    utterance: BAPI_MATERIAL_STOCK_REQ_LIST 的库存
    expect:
      decision_type: CLARIFY
      capability_id: MM.Inventory.GetAvailability
      parameters:
        material: MATERIAL
      missing:
        - plant
      clarification: 请提供要查询的工厂。
      is_ambiguous: false
      clarification_strict: true
  - name: inv-ambiguous-show-options
    mode: single
    utterance: 有没有采购
    expect:
      decision_type: SHOW_OPTIONS
      capability_id: null
      parameters: {}
      missing:
        - material
        - plant
      clarification: 请提供要查询的物料编号和工厂。
      is_ambiguous: true
      clarification_strict: true
  - name: inv-multi-with-po
    mode: single
    utterance: DEMOA2 在 5100 的库存，再列出近 30 天未清采购订单
    expect:
      decision_type: ESCALATE_TO_PLANNER
      capability_id: null
      parameters: {}
      missing: []
      clarification: null
      is_ambiguous: false
      clarification_strict: true
  - name: inv-technical-override
    mode: single
    utterance: 库存 $filter=Material eq 'DEMOA2'
    expect:
      decision_type: REJECT
      capability_id: null
      parameters: {}
      missing: []
      clarification: null
      is_ambiguous: false
      clarification_strict: true
  - name: inv-sticky-overlay
    mode: sticky
    utterance: 工厂 5200
    last_context:
      capability_id: MM.Inventory.GetAvailability
      decision_type: SELECT
      parameters:
        material: DEMOA2
        plant: '5100'
    expect:
      decision_type: SELECT
      capability_id: MM.Inventory.GetAvailability
      parameters:
        material: DEMOA2
        plant: '5200'
      missing: []
      clarification: null
      is_ambiguous: false
      clarification_strict: true
  - name: inv-sticky-reask-suspect
    mode: sticky
    utterance: 还是查 demoa2 在 5200 吧
    last_context:
      capability_id: MM.Inventory.GetAvailability
      decision_type: SELECT
      parameters:
        material: DEMOA2
        plant: '5100'
    expect:
      decision_type: CLARIFY
      capability_id: MM.Inventory.GetAvailability
      parameters:
        plant: '5200'
      missing:
        - material
      clarification: 请提供要查询的物料编号。
      is_ambiguous: false
      clarification_strict: true
  - name: inv-sticky-new-turn-inherit
    mode: sticky
    utterance: 查一下库存
    last_context:
      capability_id: MM.Inventory.GetAvailability
      decision_type: SELECT
      parameters:
        material: DEMOA2
        plant: '5100'
    expect:
      decision_type: CLARIFY
      capability_id: MM.Inventory.GetAvailability
      parameters:
        material: DEMOA2
      missing:
        - plant
      clarification: 请提供要查询的物料编号和工厂。
      is_ambiguous: false
      clarification_strict: true
