capability: MM.PurchaseOrder.GetList
rows:
  - name: po-by-number
    mode: single
    utterance: 查询采购订单 4500000001 的明细
    expect:
      decision_type: SELECT
      capability_id: MM.PurchaseOrder.GetList
      parameters:
        poNumber: '4500000001'
      missing: []
      clarification: null
      is_ambiguous: false
      matched_intents:
        - capability_id: MM.PurchaseOrder.GetList
          parameters:
            poNumber: '4500000001'
          missing: []
      clarification_strict: true
  - name: po-by-vendor
    mode: single
    utterance: 查供应商 1000 的采购订单
    expect:
      decision_type: SELECT
      capability_id: MM.PurchaseOrder.GetList
      parameters:
        vendor: '1000'
      missing: []
      clarification: null
      is_ambiguous: false
      matched_intents:
        - capability_id: MM.PurchaseOrder.GetList
          parameters:
            vendor: '1000'
          missing: []
      clarification_strict: true
  - name: po-by-material-and-plant
    mode: single
    utterance: 查工厂 5300 物料 DEMOA4B 的采购订单
    expect:
      decision_type: SELECT
      capability_id: MM.PurchaseOrder.GetList
      parameters:
        plant: '5300'
        material: DEMOA4B
      missing: []
      clarification: null
      is_ambiguous: false
      matched_intents:
        - capability_id: MM.PurchaseOrder.GetList
          parameters:
            plant: '5300'
            material: DEMOA4B
          missing: []
      clarification_strict: true
  - name: po-no-filter
    mode: single
    utterance: 帮我查一下采购订单
    expect:
      decision_type: CLARIFY
      capability_id: MM.PurchaseOrder.GetList
      parameters: {}
      missing:
        - filter
      clarification: 请至少提供一个过滤条件（采购订单号、供应商、工厂或物料）。
      is_ambiguous: false
      matched_intents:
        - capability_id: MM.PurchaseOrder.GetList
          parameters: {}
          missing:
            - filter
      clarification_strict: true
  - name: po-number-value-excluded
    mode: single
    utterance: 采购订单 4500000001 供应商 4500000001
    expect:
      decision_type: SELECT
      capability_id: MM.PurchaseOrder.GetList
      parameters:
        vendor: '4500000001'
      missing: []
      clarification: null
      is_ambiguous: false
      matched_intents:
        - capability_id: MM.PurchaseOrder.GetList
          parameters:
            vendor: '4500000001'
          missing: []
      clarification_strict: true
  - name: po-bare-po-trigger
    mode: single
